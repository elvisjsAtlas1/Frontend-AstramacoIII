<div *ngIf="isLoggedIn(); else loginTemplate">

  <div class="topbar">

    <div class="logo">
      <h2>Astramaco</h2>
    </div>

    <nav class="menu">
      <a routerLink="/pedidos" routerLinkActive="active-link">📦 Pedidos</a>
      <a routerLink="/transportistas" routerLinkActive="active-link">🚚 Transportistas</a>
      <a routerLink="/documentos" routerLinkActive="active-link">📄 Documentos</a>
      <a routerLink="/cargas" routerLinkActive="active-link">⚙️ Cargas</a>
    </nav>

    <button class="logout" (click)="logout()">Cerrar sesión</button>

  </div>

  <div class="content">
    <router-outlet></router-outlet>
  </div>

</div>

<ng-template #loginTemplate>
  <router-outlet></router-outlet>
</ng-template>
